name: Atlas quality checks

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile package manifest and lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile repair on development branches
        if: startsWith(github.ref, 'refs/heads/codex/')
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit and component tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build
